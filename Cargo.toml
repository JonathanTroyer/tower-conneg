[package]
name = "tower-conneg"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Tower middleware for HTTP content negotiation"
repository = "https://github.com/JonathanTroyer/tower-conneg"
readme = "README.md"
keywords = ["http", "tower", "content-negotiation", "middleware"]
categories = ["web-programming", "network-programming"]

[features]
default = ["json"]
json = ["dep:serde_json"]
form = ["dep:serde_urlencoded", "dep:form_urlencoded"]
plain = []
msgpack = ["dep:rmp-serde"]
cbor = ["dep:cbor4ii"]
xml = ["dep:quick-xml"]
toml = ["dep:toml"]
postcard = ["dep:postcard"]
bson = ["dep:bson", "dep:serde_json"]
hyper-client = ["dep:hyper", "dep:hyper-util"]
axum = ["dep:axum", "dep:tokio"]
poem = ["dep:poem"]
salvo = ["dep:salvo"]
viz = ["dep:viz"]

[dependencies]
bon = "3.8.2"
bytes = "1"
erased-serde = "0.4"
http = "1"
http-body = "1"
http-body-util = "0.1"
mediatype = "0.21"
pin-project-lite = "0.2"
sealed = "0.6.0"
serde = "1.0"
thiserror = "2"
serde_json = { version = "1.0", optional = true }
serde_urlencoded = { version = "0.7", optional = true }
form_urlencoded = { version = "1.2", optional = true }
rmp-serde = { version = "1.3", optional = true }
cbor4ii = { version = "1.2", optional = true, features = ["use_std", "serde1"] }
quick-xml = { version = "0.37", features = [
  "serialize",
  "serde",
], optional = true }
toml = { version = "0.8", optional = true }
postcard = { version = "1.1", optional = true, features = ["alloc"] }
bson = { version = "3.1", optional = true, features = ["serde"] }
tower = "0.5"
hyper = { version = "1", optional = true }
hyper-util = { version = "0.1", optional = true, features = ["client-legacy"] }
axum = { version = "0.8", optional = true }
poem = { version = "3", optional = true, features = ["tower-compat", "test"] }
salvo = { version = "0.77", optional = true, features = [
  "tower-compat",
  "test",
] }
viz = { version = "0.10", optional = true }
tokio = { version = "1", optional = true, features = [
  "rt-multi-thread",
  "macros",
  "net",
] }

[dev-dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
quick-xml = { version = "0.37", features = ["serialize", "serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
tower = { version = "0.5", features = ["util"] }

[[example]]
name = "server"
required-features = ["axum", "json", "msgpack"]

[[example]]
name = "client"
required-features = ["json", "xml"]

[lints.rust]
unsafe_code = "forbid"
future_incompatible = { level = "deny", priority = -1 }
rust_2018_idioms = { level = "warn", priority = -1 }
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
todo = "deny"
unimplemented = "deny"
module_name_repetitions = "allow"
must_use_candidate = "allow"
